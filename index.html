<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f3">
  <meta name="description" content="Lerne entspannt mit zehn Fingern zu tippen. Kurze Übungen, freundliches Feedback und sichtbarer Fortschritt.">
  <title>Tiperly – Tippen lernen. Ganz in deinem Tempo.</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="dark.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="Tiperly Start"><span class="brand-mark">t<span>·</span></span><span>tiperly</span></a>
      <div class="nav-caption">DEIN LERNRAUM</div>
      <nav class="side-nav" aria-label="Hauptnavigation">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span>Übersicht</button>
        <button class="nav-item" data-view="course"><span class="nav-icon">▤</span>Mein Kurs</button>
        <button class="nav-item" data-view="progress"><span class="nav-icon">◷</span>Fortschritt</button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="daily-card"><div class="daily-icon">✳</div><strong>Kleine Schritte zählen.</strong><p>Schon 5 Minuten Übung bringen dich weiter.</p><div class="mini-progress"><span id="dailyFill"></span></div><small id="dailyLabel">0 von 5 Minuten</small></div>
      <button class="nav-item settings-link" id="settingsBtn"><span class="nav-icon">⚙</span>Einstellungen</button>
      <div class="profile"><div class="avatar">T</div><div><strong>Dein Lernplatz</strong><small>Schön, dass du da bist</small></div><span class="profile-dots">···</span></div>
    </aside>

    <main class="main-area">
      <header class="topbar"><div class="breadcrumb">Dein Lernraum <span>/</span> <b id="crumbCurrent">Übersicht</b></div><div class="top-actions"><span class="streak"><span>✦</span> <b id="streakCount">0</b> Übungstage</span><button class="icon-button" id="themeBtn" aria-label="Dunkelmodus einschalten" title="Dunkelmodus einschalten">☾</button><button class="icon-button" id="soundBtn" aria-label="Ton an oder ausschalten" title="Ton an oder ausschalten">♫</button></div></header>
      <div id="pageContent"></div>
      <footer class="footer"><span>Mit Ruhe und Freude lernen.</span><span>TIPERLY <i>·</i> DEIN TEMPO. DEIN WEG.</span></footer>
    </main>
  </div>
  <div class="modal-backdrop" id="practiceModal" aria-hidden="true"><section class="practice-dialog" role="dialog" aria-modal="true" aria-labelledby="practiceTitle"></section></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
